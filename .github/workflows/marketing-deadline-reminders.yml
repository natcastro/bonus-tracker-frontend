name: Marketing deadline reminders

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminder check
        run: |
          code=$(curl -s --retry 2 --retry-delay 5 -o response.txt -w '%{http_code}' -X POST "https://transcendent-axolotl-027557.netlify.app/.netlify/functions/check-deadline-reminders" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}")
          echo "HTTP $code"
          cat response.txt; echo
          [ "$code" -lt 400 ]
